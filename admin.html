<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Sankalp Creative Studio</title><link rel="stylesheet" href="/style.css"></head><body><header><a href="/" class="brand">sankalp<span>✦</span><small>CREATIVE STUDIO</small></a><a href="/">← Back to store</a></header><main class="admin-wrap"><h1>Studio administration</h1><section id="login" class="admin-panel" style="max-width:420px"><h2>Admin sign in</h2><form id="loginForm"><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">Sign in</button></form><p id="loginError" class="muted"></p></section><section id="dashboard" hidden><button class="ghost" onclick="logout()">Sign out</button><div class="admin-grid"><div class="admin-panel"><h2>Product management</h2><form id="productForm"><input type="hidden" name="id"><label>Product name<input name="name" required></label><label>Category<input name="category" required></label><label>Price in INR<input name="price" type="number" min="1" required></label><label>Minimum quantity<input name="minQty" type="number" min="1" value="1"></label><label>Description<textarea name="description"></textarea></label><label>Image URL<input name="image" placeholder="https://..."></label><label>Active<select name="active"><option value="true">Yes</option><option value="false">No</option></select></label><button class="primary">Save product</button><button type="reset" class="ghost">New product</button></form><h3>Products</h3><div id="productList"></div></div><div><div class="admin-panel"><h2>Customer orders</h2><div id="orders"></div></div><div class="admin-panel" style="margin-top:20px"><h2>Bulk enquiries</h2><div id="enquiries"></div></div></div></div></section></main><script src="/admin.js"></script></body></html>
